name: Update Homebrew tap

# Runs when a release is published, not when it is drafted: the draft is the
# review step, and only a published release should change what `brew install`
# hands people.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag to point the cask at, e.g. v0.1.1
        required: true

jobs:
  cask:
    name: Cask
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # This job only runs a node script. The default cache looks for
          # pnpm because package.json names it, then fails before the cask
          # is written. 0.1.4 through 0.1.8 never reached the tap.
          package-manager-cache: false

      - name: Find the macOS build
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > names.txt
          asset=$(grep -m1 '_universal\.dmg$' names.txt)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --dir dmg
          echo "sha256=$(sha256sum "dmg/$asset" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A fine-grained PAT with contents:write on statico/tap. The default
      # GITHUB_TOKEN cannot reach another repository.
      - name: Check out the tap
        uses: actions/checkout@v5
        with:
          repository: statico/tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Write the cask
        run: |
          node scripts/update-tap.mjs \
            --version "${{ steps.release.outputs.version }}" \
            --asset "${{ steps.release.outputs.asset }}" \
            --sha256 "${{ steps.release.outputs.sha256 }}" \
            --out tap/Casks/nethack-tiles-client.rb

      - name: Push it
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged, not working-tree: on the first release the cask is a new
          # file, which `git diff` alone reports as no change at all.
          git add Casks/nethack-tiles-client.rb
          if git diff --cached --quiet; then
            echo "the cask already describes this release"
            exit 0
          fi
          git commit -m "nethack-tiles-client ${{ steps.release.outputs.version }}"
          git push
