[package]
name = "nethack-tiles-client"
version = "0.1.9"
description = "NetHack tiles client for public servers (NAO / Hardfought)"
authors = ["Ian Langworth"]
edition = "2021"
license = "MIT"
repository = "https://github.com/statico/nethack-tiles-client"
# The app is the only binary. `tiles2png` and `appicon` are examples rather
# than `src/bin` entries because the macOS bundler copies every binary the
# package declares into the .app, and a universal build only ever lipos the
# main one — so a second binary breaks `--target universal-apple-darwin`.
default-run = "nethack-tiles-client"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
# Kept as-is through the rename so every `use nethack_tiles_lib::` stays put.
name = "nethack_tiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
russh = "0.62.5"
tokio = { version = "1.53.1", features = ["full"] }
directories = "6.0.0"
toml = "1.1.4"
thiserror = "2.0.19"
base64 = "0.23.0"
log = "0.4.33"
tauri-plugin-dialog = "2.7.2"

# Only for the pseudo-terminal a locally installed NetHack needs; see local.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The keychain backend is selected per platform; compiling all three everywhere
# would drag zbus/dbus into the macOS and Windows builds for no reason.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.6", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.6", features = ["zbus-secret-service-keyring-store"] }
